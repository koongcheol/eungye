<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 영상, AI, 웹 중 어디에 맞을까?</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4FB; --surface:#FFFFFF; --ink:#191C38; --muted:#5D6285; --line:#DCE0F0;
  --video:#FF4B5C; --ai:#7357FF; --web:#00A3BF;
  --display:"Do Hyeon","Pretendard",system-ui,sans-serif;
  --body:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12142A; --surface:#1C1F3D; --ink:#EEF0FF; --muted:#A3A8CC; --line:#30346A;
    --video:#FF6372; --ai:#8F7AFF; --web:#1CC0DB; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ai);outline-offset:3px}
img{max-width:100%;display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto;padding:16px 20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:700;font-size:15px}
.rec{width:10px;height:10px;border-radius:50%;background:var(--video);animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:999px;color:var(--muted);font-size:15px;font-weight:600}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink)}

main{padding:8px 20px 48px}
.narrow{max-width:560px;margin:0 auto}
.wide{max-width:1100px;margin:0 auto}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:1.15;margin:0}

/* home */
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(40px,11vw,64px)}
.hero h1 span{display:block}
.hero h1 .t-video{color:var(--video)} .hero h1 .t-ai{color:var(--ai)} .hero h1 .t-web{color:var(--web)}
.hero p{color:var(--muted);margin:18px 0 32px}
.ask{font-weight:700;margin:0 0 12px}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 20px;font-size:18px;font-weight:600;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.grades .btn{text-align:center;font-family:var(--display);font-size:26px;font-weight:400;padding:20px 8px}

/* quiz */
.strip{display:flex;gap:4px;margin:12px 0 28px}
.strip i{flex:1;height:8px;border-radius:2px;background:var(--line)}
.strip i.on{background:var(--ink)}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;font-weight:600;margin-bottom:10px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.q{font-size:clamp(28px,7vw,36px);margin-bottom:28px}
.opts{display:grid;gap:10px}

/* dept quiz */
.strip.quiz i.on{background:var(--web)}
.btn.ok{border-color:#1FA463;background:color-mix(in srgb,#1FA463 16%,var(--surface))}
.btn.no{border-color:var(--video);opacity:.55;text-decoration:line-through;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.7em;font-weight:700;margin:16px 0 0;text-align:center}
.fb.ok{color:#1FA463}.fb.no{color:var(--video)}

/* consult */
.lead{color:var(--muted);margin:12px 0 28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{text-align:center}
.field{margin:0 0 20px}
.field label{display:block;font-weight:700;margin-bottom:8px}
.field input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:14px;margin-top:6px}

/* result */
.card{background:var(--t);color:#fff;border-radius:28px;padding:32px 26px 28px;position:relative;overflow:hidden;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){.card,.rec,.btn.no{animation:none}}
.card .emoji{font-size:64px;line-height:1}
.card .kind{margin:18px 0 4px;font-weight:700;opacity:.9}
.card h2{font-size:clamp(34px,9vw,46px)}
.card p{margin:16px 0 0;opacity:.95}
.mix{background:var(--surface);border-radius:20px;padding:20px;margin-top:14px}
.mix h3,.box h3{margin:0 0 12px;font-size:16px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:15px;font-weight:600}
.bar .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .pct{text-align:right;color:var(--muted)}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.box{background:var(--surface);border-radius:20px;padding:20px}
.box ul{margin:0;padding-left:18px}
.actions{display:grid;gap:10px;margin-top:20px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center}
.primary:hover{opacity:.9}
.note{text-align:center;color:var(--muted);font-size:14px;margin-top:14px}

/* works */
.pagehead{padding:20px 0 20px}
.pagehead h1{font-size:clamp(34px,8vw,52px)}
.pagehead p{color:var(--muted);margin:8px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.work{background:var(--surface);border-radius:18px;overflow:hidden;border:0;padding:0;text-align:left;display:block;text-decoration:none;color:inherit}
.thumb{aspect-ratio:16/9;background:var(--line);position:relative;display:grid;place-items:center;font-size:44px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work .info{padding:14px 16px 16px}
.work .tag{display:inline-block;font-size:13px;font-weight:700;color:#fff;padding:2px 10px;border-radius:999px;margin-bottom:6px}
.work .title{font-weight:700;font-size:17px}
.work .by{color:var(--muted);font-size:14px}
.empty{background:var(--surface);border-radius:18px;padding:32px;text-align:center;color:var(--muted)}

/* stats */
.panel{background:var(--surface);border-radius:24px;padding:26px}
.total{font-family:var(--display);font-size:clamp(64px,10vw,120px);line-height:1}
.total small{font-size:.3em;color:var(--muted);margin-left:8px}
.sbar{margin:22px 0}
.sbar .head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:clamp(24px,3vw,34px)}
.sbar .head b{font-weight:400}
.sbar .track{height:28px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.sbar .fill{height:100%;border-radius:8px;transition:width .8s ease}
.minis{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.mini{background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600}
.mini b{font-family:var(--display);font-weight:400;font-size:22px;margin-left:6px}
.updated{color:var(--muted);font-size:14px;margin-top:14px}

/* gifts */
.gift{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px dashed var(--ink);border-radius:20px;padding:16px 18px;margin:0 0 28px}
.gift .ico{font-size:40px;line-height:1}
.gift b{font-family:var(--display);font-weight:400;font-size:22px;display:block;line-height:1.25}
.gift span{color:var(--muted);font-size:15px}
.gift.snack{border-color:var(--video)}

footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 28px}

@media (max-width:760px){
  .boxes{grid-template-columns:1fr}
  .nav button{padding:8px 9px}
}
</style>
</head>
<body>
<header class="top">
  <button class="brand" data-go="home"><span class="rec" aria-hidden="true"></span><span id="brandName"></span></button>
  <nav class="nav" aria-label="메뉴">
    <button data-go="home">테스트</button>
    <button data-go="works">선배 작품</button>
    <button data-go="stats">통계</button>
  </nav>
</header>
<main id="app"></main>
<footer id="foot"></footer>

<script src="config.js"></script>
<script>
(function(){
  const C = window.FESTIVAL_CONFIG;
  const app = document.getElementById("app");
  if(!C){
    app.innerHTML = `<section class="narrow"><div class="empty" style="text-align:left">
      <b>config.js 파일을 찾지 못했어요.</b><br>
      index.html과 config.js가 같은 폴더에 있어야 해요. zip 압축을 푼 뒤 festival 폴더 안의 index.html을 열어주세요.</div></section>`;
    return;
  }
  const T = C.TRACKS, IDS = ["video","ai","web"];
  const params = new URLSearchParams(location.search);
  const KIOSK = parseInt(params.get("kiosk") || "0", 10);   // 예: index.html?kiosk=60

  document.getElementById("brandName").textContent = C.SCHOOL_NAME + " " + C.DEPT_NAME;
  document.getElementById("foot").textContent = C.SCHOOL_NAME + " " + C.DEPT_NAME;

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const color = id => `var(--${id})`;
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  };

  /* ---------- Google Form 전송 ---------- */
  function parseForm(link){
    if(!link) return null;
    try{
      const u = new URL(link);
      const action = u.origin + u.pathname.replace(/\/viewform.*$/, "/formResponse");
      const map = {};
      u.searchParams.forEach((v,k) => { if(k.startsWith("entry.")) map[v.trim().toUpperCase()] = k; });
      return { action, map };
    }catch(e){ console.warn("FORM_PREFILL_LINK 형식 확인 필요", e); return null; }
  }
  const FORM = parseForm(C.FORM_PREFILL_LINK);

  async function postForm(data){
    const body = new URLSearchParams();
    Object.entries(data).forEach(([k,v]) => { const e = FORM.map[k]; if(e) body.append(e, v); });
    await fetch(FORM.action, { method:"POST", mode:"no-cors", body });
  }
  async function submit(data){
    if(!FORM) return;
    try{ await postForm(data); }
    catch(e){ const q = store.get("fest_queue", []); q.push(data); store.set("fest_queue", q); }
  }
  async function flushQueue(){
    if(!FORM) return;
    const q = store.get("fest_queue", []);
    if(!q.length) return;
    const left = [];
    for(const d of q){ try{ await postForm(d); }catch(e){ left.push(d); } }
    store.set("fest_queue", left);
  }
  flushQueue(); setInterval(flushQueue, 20000); addEventListener("online", flushQueue);

  /* ---------- 상태 ---------- */
  let S;
  const reset = () => { S = { grade:null, step:0, answers:[], order:[], quiz:[], qorder:[], consult:null, name:"" }; };
  reset();
  const QZ = Array.isArray(C.QUIZ) ? C.QUIZ : [];

  function shuffle(n){ const a = [...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function score(){
    const s = { video:0, ai:0, web:0 };
    S.answers.forEach(t => s[t]++);
    const max = Math.max(...IDS.map(i => s[i]));
    const tied = IDS.filter(i => s[i] === max);
    let win = tied[0];
    for(let k=S.answers.length-1;k>=0;k--){ if(tied.includes(S.answers[k])){ win = S.answers[k]; break; } }
    return { s, win };
  }

  /* ---------- 화면 ---------- */
  function setNav(name){
    document.querySelectorAll(".nav button").forEach(b => {
      if(b.dataset.go === name) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
    });
    window.scrollTo(0,0);
  }

  function home(){
    setNav("home"); stopStats();
    app.innerHTML = `
      <section class="narrow">
        <div class="hero">
          <h1><span>나는</span><span class="t-video">영상,</span><span class="t-ai">AI,</span><span class="t-web">웹</span><span>중 어디에 맞을까?</span></h1>
          <p>질문 ${C.QUESTIONS.length}개에 답하면 나한테 맞는 분야를 알려줘요.${QZ.length ? ` 마지막엔 학과 퀴즈 ${QZ.length}개가 기다리고 있어요.` : ""}</p>
        </div>
        <div class="gift"><div class="ico" aria-hidden="true">🎁</div>
          <div><b>끝까지 하면 NFC 말랑이 키링을 드려요!</b><span>NFC를 넣은 말랑말랑 키링이에요.</span></div></div>
        <p class="ask">몇 학년이에요?</p>
        <div class="grades">${C.GRADES.map((g,i) => `<button class="btn" data-grade="${i}">${esc(g)}</button>`).join("")}</div>
      </section>`;
    app.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => {
      reset(); S.grade = C.GRADES[+b.dataset.grade]; quiz();
    });
  }

  function quiz(){
    const i = S.step, Q = C.QUESTIONS[i], N = C.QUESTIONS.length;
    if(!S.order[i]) S.order[i] = shuffle(Q.a.length);
    app.innerHTML = `
      <section class="narrow">
        <div class="strip" aria-hidden="true">${C.QUESTIONS.map((_,k) => `<i class="${k<=i?"on":""}"></i>`).join("")}</div>
        <div class="qmeta"><span>${i+1} / ${N}</span>
          <button class="link" id="back">${i===0 ? "처음으로" : "이전 질문"}</button></div>
        <h2 class="q">${esc(Q.q)}</h2>
        <div class="opts">${S.order[i].map(k => `<button class="btn" data-k="${k}">${esc(Q.a[k].text)}</button>`).join("")}</div>
      </section>`;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      S.answers[i] = Q.a[+b.dataset.k].t;
      if(i+1 < N){ S.step++; quiz(); } else if(QZ.length) deptQuiz(0); else consult();
    });
    document.getElementById("back").onclick = () => { if(i===0) home(); else { S.step--; quiz(); } };
  }

  function consult(){
    app.innerHTML = `
      <section class="narrow">
        <div class="strip" aria-hidden="true">${C.QUESTIONS.map(() => `<i class="on"></i>`).join("")}</div>
        <h2 class="q">결과가 나왔어요!<br>마지막으로 하나만요.</h2>
        ${C.COLLECT_NAME ? `<div class="field"><label for="nm">이름 (안 써도 돼요)</label>
          <input id="nm" autocomplete="off" maxlength="20" placeholder="예: 김민준">
          <div class="hint">상담할 때 이름을 불러드리려고 받아요.</div></div>` : ""}
        <p class="ask">부스에서 선배나 선생님이랑 상담해볼래요?</p>
        <div class="gift snack"><div class="ico" aria-hidden="true">🍪</div>
          <div><b>옆으로 이동해서 30초 상담에 참여하면 과자를 드려요!</b></div></div>
        <div class="row2">
          <button class="btn" data-c="예">좋아요</button>
          <button class="btn" data-c="아니오">괜찮아요</button>
        </div>
        <p class="note"><button class="link" id="back">이전 질문으로</button></p>
      </section>`;
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
      S.consult = b.dataset.c;
      const nm = document.getElementById("nm"); S.name = nm ? nm.value.trim() : "";
      finish();
    });
    document.getElementById("back").onclick = () => QZ.length ? deptQuiz(QZ.length-1) : quiz();
  }

  function deptQuiz(j){
    const Q = QZ[j];
    if(!S.qorder[j]) S.qorder[j] = shuffle(Q.a.length);
    app.innerHTML = `
      <section class="narrow">
        <div class="strip quiz" aria-hidden="true">${QZ.map((_,k) => `<i class="${k<=j?"on":""}"></i>`).join("")}</div>
        <div class="qmeta"><span>학과 퀴즈 ${j+1} / ${QZ.length}</span>
          <button class="link" id="back">이전</button></div>
        <h2 class="q">${esc(Q.q)}</h2>
        <div class="opts">${S.qorder[j].map(k => `<button class="btn" data-k="${k}">${esc(Q.a[k])}</button>`).join("")}</div>
        <p class="fb" id="fb" aria-live="polite"></p>
      </section>`;
    const fb = document.getElementById("fb");
    let tried = false, done = false;
    app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      if(done) return;
      if(+b.dataset.k === Q.answer){
        done = true; b.classList.add("ok");
        if(S.quiz[j] === undefined) S.quiz[j] = !tried;
        fb.className = "fb ok"; fb.textContent = "정답! " + (Q.explain || "");
        setTimeout(() => { if(j+1 < QZ.length) deptQuiz(j+1); else consult(); }, 1400);
      } else {
        tried = true; b.classList.add("no"); b.disabled = true;
        fb.className = "fb no"; fb.textContent = "땡! 다시 골라봐요.";
      }
    });
    document.getElementById("back").onclick = () => {
      if(j === 0){ S.step = C.QUESTIONS.length - 1; quiz(); } else deptQuiz(j-1);
    };
  }

  function finish(){
    const { s, win } = score();
    const data = {
      GRADE: S.grade, RESULT: T[win].label, CONSULT: S.consult,
      SCORES: IDS.map(i => `${T[i].label} ${s[i]}`).join(" / "),
      NAME: S.name,
      QUIZ: QZ.length ? `${S.quiz.filter(Boolean).length}/${QZ.length}` : ""
    };
    submit(data);
    const local = store.get("fest_local", []); local.push({ g:S.grade, r:win, c:S.consult }); store.set("fest_local", local);
    result(win, s);
  }

  function result(win, s){
    setNav("");
    const R = T[win], N = C.QUESTIONS.length;
    app.innerHTML = `
      <section class="narrow">
        <div class="card" style="--t:${color(win)}">
          <div class="emoji" aria-hidden="true">${R.emoji}</div>
          <div class="kind">${esc(R.label)} 타입</div>
          <h2>${esc(R.title)}</h2>
          <p>${esc(R.desc)}</p>
        </div>
        <div class="mix"><h3>나의 성향 비율</h3>
          ${IDS.map(i => { const p = Math.round(s[i]/N*100); return `
            <div class="bar"><span>${esc(T[i].label)}</span>
              <span class="track"><span class="fill" style="width:${p}%;background:${color(i)}"></span></span>
              <span class="pct">${p}%</span></div>`; }).join("")}
        </div>
        <div class="boxes">
          <div class="box"><h3>우리 과에서 배워요</h3><ul>${R.learn.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
          <div class="box"><h3>이런 직업이 있어요</h3><ul>${R.jobs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="seeWorks">${C.WORKS.some(w => w.track === win) ? esc(R.label) + " " : ""}선배 작품 보기</button>
          <button class="btn" id="again" style="text-align:center">처음부터 다시 하기</button>
        </div>
        <div class="gift" style="margin:20px 0 0"><div class="ico" aria-hidden="true">🎁</div>
          <div><b>이 화면을 선배에게 보여주고 말랑이 키링 받아가세요!</b></div></div>
        ${S.consult === "예" ? `<div class="gift snack" style="margin:12px 0 0"><div class="ico" aria-hidden="true">🍪</div>
          <div><b>옆 상담 자리로 이동해 주세요!</b><span>30초 상담에 참여하면 과자를 드려요.</span></div></div>` : ""}
      </section>`;
    document.getElementById("seeWorks").onclick = () => works(C.WORKS.some(w => w.track === win) ? win : "all");
    document.getElementById("again").onclick = () => { reset(); home(); };
  }

  function works(filter){
    setNav("works"); stopStats();
    let f = filter || "all";
    const draw = () => {
      const list = C.WORKS.filter(w => f === "all" || w.track === f);
      app.innerHTML = `
        <section class="wide">
          <div class="pagehead"><h1>선배들이 만든 작품</h1><p>${esc(C.DEPT_NAME)} 선배들이 수업 시간에 직접 만들었어요.</p></div>
          <div class="chips" role="group" aria-label="분야 고르기">
            <button class="chip" data-f="all" aria-pressed="${f==="all"}">전체</button>
            ${IDS.filter(i => C.WORKS.some(w => w.track === i)).map(i => `<button class="chip" data-f="${i}" aria-pressed="${f===i}">${T[i].emoji} ${esc(T[i].label)}</button>`).join("")}
          </div>
          ${list.length ? `<div class="grid">${list.map(w => {
            const tr = T[w.track] || T.video;
            const inner = `
              <div class="thumb" style="background:color-mix(in srgb, ${color(w.track)} 25%, var(--line))">
                <span aria-hidden="true">${tr.emoji}</span>
                <img src="${esc(w.image)}" alt="${esc(w.title)}" loading="lazy" onerror="this.remove()">
              </div>
              <div class="info"><span class="tag" style="background:${color(w.track)}">${esc(tr.label)}</span>
                <div class="title">${esc(w.title)}</div><div class="by">${esc(w.author)}</div></div>`;
            return w.link ? `<a class="work" href="${esc(w.link)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="work">${inner}</div>`;
          }).join("")}</div>`
          : `<div class="empty">아직 이 분야 작품이 없어요. config.js의 WORKS에 작품을 추가하면 여기에 보여요.</div>`}
        </section>`;
      app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { f = b.dataset.f; draw(); });
    };
    draw();
  }

  /* ---------- 실시간 통계 ---------- */
  let statsTimer = null;
  function stopStats(){ if(statsTimer){ clearInterval(statsTimer); statsTimer = null; } }

  function localStats(){
    const l = store.get("fest_local", []);
    const out = { total:l.length, result:{}, grade:{}, consult:0 };
    l.forEach(x => {
      const lab = T[x.r] ? T[x.r].label : x.r;
      out.result[lab] = (out.result[lab]||0)+1;
      out.grade[x.g] = (out.grade[x.g]||0)+1;
      if(x.c === "예") out.consult++;
    });
    return out;
  }

  async function loadStats(){
    if(!C.STATS_URL) return { data: localStats(), src:"local" };
    try{
      const r = await fetch(C.STATS_URL + (C.STATS_URL.includes("?")?"&":"?") + "t=" + Date.now());
      return { data: await r.json(), src:"live" };
    }catch(e){ return { data: localStats(), src:"error" }; }
  }

  function stats(){
    setNav("stats");
    app.innerHTML = `
      <section class="wide">
        <div class="pagehead"><h1>지금까지 참여한 친구들</h1></div>
        <div class="panel" id="sp"><p class="updated">불러오는 중…</p></div>
      </section>`;

    const paint = async () => {
      const { data:d, src } = await loadStats();
      const sp = document.getElementById("sp"); if(!sp) return;
      const total = d.total || 0, maxR = Math.max(1, ...IDS.map(i => d.result?.[T[i].label] || 0));
      const now = new Date().toLocaleTimeString("ko-KR");
      sp.innerHTML = `
        <div class="total">${total}<small>명</small></div>
        ${IDS.map(i => { const n = d.result?.[T[i].label] || 0; return `
          <div class="sbar"><div class="head"><b>${T[i].emoji} ${esc(T[i].label)}</b><span>${n}명</span></div>
            <div class="track"><div class="fill" style="width:${n/maxR*100}%;background:${color(i)}"></div></div></div>`; }).join("")}
        <div class="minis">
          ${C.GRADES.map(g => `<span class="mini">${esc(g)}<b>${d.grade?.[g] || 0}</b></span>`).join("")}
          <span class="mini">상담 희망<b>${d.consult || 0}</b></span>
        </div>
        <p class="updated">${src==="live" ? `${now} 업데이트 · 15초마다 새로고침`
          : src==="error" ? `구글 시트에 연결하지 못해 이 기기 기록만 보여주고 있어요. config.js의 STATS_URL을 확인하세요.`
          : `이 기기에서 참여한 기록만 보여요. 전체 통계는 config.js에 STATS_URL을 넣으면 나와요.`}</p>`;
    };
    paint(); stopStats(); statsTimer = setInterval(paint, 15000);
  }

  /* ---------- 라우팅 ---------- */
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if(location.hash !== "#"+g) location.hash = g; else route();
  });
  function route(){
    const h = location.hash.slice(1);
    if(h === "works") works(); else if(h === "stats") stats(); else { reset(); home(); }
  }
  addEventListener("hashchange", route);
  route();

  /* ---------- 부스 태블릿 모드: 일정 시간 손대지 않으면 처음 화면으로 ---------- */
  if(KIOSK > 0){
    let idle;
    const arm = () => { clearTimeout(idle); idle = setTimeout(() => {
      if(location.hash.slice(1) === "stats") return;
      reset(); if(location.hash) location.hash = ""; home();
    }, KIOSK*1000); };
    ["pointerdown","keydown","scroll"].forEach(e => addEventListener(e, arm, { passive:true }));
    arm();
  }
})();
</script>
</body>
</html>
